<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
  </head>
  <body class="min-vh-100">
    <h3 class="display-3 text-center text-primary m-2 p-2">Login</h3>
    <div
      class="container d-flex flex-column gap-3 mt-5 justify-content-center"
      style="max-width: 500px"
    >
      <form class="d-flex flex-column gap-2" id="loginForm">
        <input
          class="form-control"
          type="email"
          name="email"
          id="email"
          placeholder="Mailaka"
        />
        <input
          class="form-control"
          type="password"
          name="password"
          id="password"
          placeholder="Teny miafina"
        />

        <button class="btn btn-outline-success" type="submit" id="loginBtn">
          Login
        </button>
      </form>
      <button class="btn btn-outline-danger" id="btnGg">Google</button>
    </div>
    <div id="loader"></div>

    <script type="module" src="../js/modules/auth/login.js"></script>
  </body>
</html>
